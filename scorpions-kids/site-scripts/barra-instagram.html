<!-- ============================================================
     SCORPIONS KIDS — Barra flutuante "Siga-nos no Instagram"
     Loja: Yampi (scorpionsmultiloja) — NÃO usar na Scorpions Mkt e Eventos.
     Onde colar: painel Yampi › área de scripts personalizados (rodapé / body).
     Para remover: apague este bloco do painel.
     ============================================================ -->
<style>
#sk-ig-bar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,140%);z-index:9998;display:flex;align-items:center;gap:10px;
  padding:9px 10px 9px 12px;border-radius:12px;max-width:calc(100vw - 32px);
  background:linear-gradient(90deg,#5b51d8 0%,#833ab4 35%,#c13584 65%,#fd1d1d 100%);
  box-shadow:0 8px 24px rgba(131,58,180,.35);font:600 15px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:#fff;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s;opacity:0}
#sk-ig-bar.sk-show{transform:translate(-50%,0);opacity:1}
#sk-ig-bar a{color:#fff;text-decoration:none;display:flex;align-items:center;gap:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sk-ig-bar a:focus-visible,#sk-ig-close:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:6px}
#sk-ig-bar .sk-ic{flex:0 0 28px;height:28px;border-radius:7px;background:rgba(255,255,255,.18);display:grid;place-items:center}
#sk-ig-close{all:unset;cursor:pointer;width:28px;height:28px;display:grid;place-items:center;border-radius:6px;font-size:18px;line-height:1;color:#fff;opacity:.9}
#sk-ig-close:hover{background:rgba(255,255,255,.15)}
@media (max-width:480px){#sk-ig-bar{font-size:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){#sk-ig-bar{transition:none}}
</style>
<script>
(function(){
  var HANDLE="scorpionskidss";                 // @ do Instagram (confira!)
  var URL_IG="https://www.instagram.com/"+HANDLE+"/";
  var DIAS_OCULTO=7;                           // após fechar, some por 7 dias
  var KEY="sk_ig_bar_fechada";
  // Não aparece no carrinho/checkout/pagamento para não tirar o cliente da compra
  if(/checkout|carrinho|cart|pagamento|obrigado|pedido/i.test(location.href))return;
  try{var t=+localStorage.getItem(KEY);if(t&&Date.now()-t<DIAS_OCULTO*864e5)return;}catch(e){}
  function track(acao){try{(window.dataLayer=window.dataLayer||[]).push({event:"instagram_bar",acao:acao});}catch(e){}}
  function montar(){
    if(document.getElementById("sk-ig-bar"))return;
    var bar=document.createElement("div");bar.id="sk-ig-bar";bar.setAttribute("role","complementary");bar.setAttribute("aria-label","Instagram da Scorpions Kids");
    bar.innerHTML='<a href="'+URL_IG+'" target="_blank" rel="noopener">'+
      '<span class="sk-ic" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#fff" stroke="none"/></svg></span>'+
      '<span>Siga-nos no Instagram @'+HANDLE+'</span></a>'+
      '<button id="sk-ig-close" type="button" aria-label="Fechar">&times;</button>';
    document.body.appendChild(bar);
    bar.querySelector("a").addEventListener("click",function(){track("clique");});
    bar.querySelector("#sk-ig-close").addEventListener("click",function(){
      bar.classList.remove("sk-show");try{localStorage.setItem(KEY,String(Date.now()));}catch(e){}
      track("fechou");setTimeout(function(){bar.remove();},500);});
    requestAnimationFrame(function(){bar.classList.add("sk-show");track("exibiu");});
  }
  // Só aparece depois que a pessoa rola um pouco a página (ou após 8s) — não atrapalha a primeira impressão
  var feito=false;function gatilho(){if(feito)return;feito=true;montar();removeEventListener("scroll",onScroll);}
  function onScroll(){if(scrollY>400)gatilho();}
  function iniciar(){addEventListener("scroll",onScroll,{passive:true});setTimeout(gatilho,8000);}
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",iniciar);else iniciar();
})();
</script>
